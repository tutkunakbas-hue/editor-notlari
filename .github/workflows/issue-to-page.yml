name: AI Note to HTML Page

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-page:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'publish'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate HTML page
        run: |
          python3 << 'PY'
          import os
          import re
          import html
          import json
          import datetime
          import pathlib

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          event = json.load(open(event_path))

          issue = event.get("issue", {})
          title = issue.get("title", "AI Editör Notu")
          body = issue.get("body", "")
          number = issue.get("number", "manual")

          def slugify(text):
              tr = str.maketrans("çğıöşüÇĞİÖŞÜ", "cgiosuCGIOSU")
              text = text.translate(tr).lower()
              text = re.sub(r"[^a-z0-9]+", "-", text).strip("-")
              return text[:90] or "ai-editor-notu"

          today = datetime.date.today().isoformat()
          slug = slugify(title)
          pathlib.Path("notes").mkdir(exist_ok=True)
          filename = f"notes/{today}-{slug}.html"

          def convert_markdown(md):
              lines = md.splitlines()
              output = []
              in_list = False
              in_table = False

              for line in lines:
                  row = line.rstrip()

                  if not row:
                      if in_list:
                          output.append("</ul>")
                          in_list = False
                      if in_table:
                          output.append("</tbody></table></div>")
                          in_table = False
                      continue

                  if row.startswith("## "):
                      output.append(f"<h2>{html.escape(row[3:])}</h2>")
                  elif row.startswith("### "):
                      output.append(f"<h3>{html.escape(row[4:])}</h3>")
                  elif row.startswith("- "):
                      if not in_list:
                          output.append("<ul>")
                          in_list = True
                      output.append(f"<li>{html.escape(row[2:])}</li>")
                  elif "|" in row:
                      cells = [c.strip() for c in row.strip("|").split("|")]
                      if all(re.fullmatch(r":?-{3,}:?", c) for c in cells):
                          continue
                      if not in_table:
                          output.append('<div class="table-wrap"><table><tbody>')
                          in_table = True
                      output.append("<tr>" + "".join(f"<td>{html.escape(c)}</td>" for c in cells) + "</tr>")
                  else:
                      if in_list:
                          output.append("</ul>")
                          in_list = False
                      if in_table:
                          output.append("</tbody></table></div>")
                          in_table = False
                      output.append(f"<p>{html.escape(row)}</p>")

              if in_list:
                  output.append("</ul>")
              if in_table:
                  output.append("</tbody></table></div>")

              return "\n".join(output)

          content = convert_markdown(body)

          page = f"""<!doctype html>
          <html lang="tr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{html.escape(title)}</title>
            <style>
              body {{
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
                max-width: 920px;
                margin: 0 auto;
                padding: 24px;
                line-height: 1.58;
                color: #111;
              }}
              h1 {{ font-size: 32px; line-height: 1.2; }}
              h2 {{ margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 6px; }}
              table {{ width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 15px; }}
              td {{ border: 1px solid #ddd; padding: 10px; vertical-align: top; }}
              tr:first-child td {{ font-weight: 700; background: #f3f3f3; }}
              .table-wrap {{ overflow-x: auto; }}
              .meta {{ color: #666; font-size: 13px; margin-bottom: 24px; }}
            </style>
          </head>
          <body>
            <h1>{html.escape(title)}</h1>
            <div class="meta">Yayın tarihi: {today} · Issue #{number}</div>
            {content}
          </body>
          </html>"""

          pathlib.Path(filename).write_text(page, encoding="utf-8")

          index_path = pathlib.Path("index.html")
          link = f'<li><a href="{filename}">{html.escape(title)}</a> — {today}</li>'

          if index_path.exists():
              index = index_path.read_text(encoding="utf-8")
          else:
              index = "<!doctype html><html><body><h1>Editör Notları</h1><ul></ul></body></html>"

          if "</ul>" in index:
              index = index.replace("</ul>", link + "\n</ul>")
          else:
              index += "<ul>" + link + "</ul>"

          index_path.write_text(index, encoding="utf-8")
          PY

            - name: Commit generated page
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Publish AI note as page" || echo "No changes"
          git push

      - name: Send to Telegram
        run: |
          TITLE="${{ github.event.issue.title }}"
          OWNER="${{ github.repository_owner }}"

          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g')

          DATE=$(date +%F)

          URL="https://${OWNER}.github.io/editor-notlari/notes/${DATE}-${SLUG}.html"

          MESSAGE="Editör Notu:%0A%0A${TITLE}%0A%0A${URL}%0A"

          curl -s \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MESSAGE}"
          
