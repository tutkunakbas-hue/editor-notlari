name: AI Note to HTML Page

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  build-page:
    if: github.event.label.name == 'publish'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate page and Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_HABER_CHAT_ID: ${{ secrets.TELEGRAM_HABER_CHAT_ID }}
        run: |
          python3 << 'PY'
          import os, re, html, json, datetime, pathlib, urllib.parse, urllib.request

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          issue = event["issue"]

          title = issue["title"]
          body = issue.get("body") or ""
          number = issue["number"]

          def slugify(text):
              tr = str.maketrans("çğıöşüÇĞİÖŞÜ", "cgiosuCGIOSU")
              text = text.translate(tr).lower()
              text = re.sub(r"[^a-z0-9]+", "-", text).strip("-")
              return text[:90] or f"not-{number}"

          today = datetime.date.today().isoformat()
          slug = slugify(title)
          pathlib.Path("notes").mkdir(exist_ok=True)
          filename = f"notes/{today}-{slug}.html"

          def convert(md):
              lines = md.splitlines()
              out = []
              in_list = False
              in_table = False

              for line in lines:
                  row = line.rstrip()

                  if not row:
                      if in_list:
                          out.append("</ul>")
                          in_list = False
                      if in_table:
                          out.append("</tbody></table></div>")
                          in_table = False
                      continue

                  if row.startswith("## "):
                      out.append(f"<h2>{html.escape(row[3:])}</h2>")
                  elif row.startswith("### "):
                      out.append(f"<h3>{html.escape(row[4:])}</h3>")
                  elif row.startswith("- "):
                      if not in_list:
                          out.append("<ul>")
                          in_list = True
                      out.append(f"<li>{html.escape(row[2:])}</li>")
                  elif "|" in row:
                      cells = [c.strip() for c in row.strip("|").split("|")]
                      if all(re.fullmatch(r":?-{3,}:?", c) for c in cells):
                          continue
                      if not in_table:
                          out.append('<div class="table-wrap"><table><tbody>')
                          in_table = True
                      out.append("<tr>" + "".join(f"<td>{html.escape(c)}</td>" for c in cells) + "</tr>")
                  else:
                      if in_list:
                          out.append("</ul>")
                          in_list = False
                      if in_table:
                          out.append("</tbody></table></div>")
                          in_table = False
                      out.append(f"<p>{html.escape(row)}</p>")

              if in_list:
                  out.append("</ul>")
              if in_table:
                  out.append("</tbody></table></div>")

              return "\n".join(out)

          content = convert(body)

          page = f"""<!doctype html>
          <html lang="tr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{html.escape(title)}</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; max-width: 920px; margin: 0 auto; padding: 24px; line-height: 1.58; color: #111; }}
              h1 {{ font-size: 32px; line-height: 1.2; }}
              h2 {{ margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 6px; }}
              table {{ width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 15px; }}
              td {{ border: 1px solid #ddd; padding: 10px; vertical-align: top; }}
              tr:first-child td {{ font-weight: 700; background: #f3f3f3; }}
              .table-wrap {{ overflow-x: auto; }}
              .meta {{ color: #666; font-size: 13px; margin-bottom: 24px; }}
            </style>
          </head>
          <body>
            <h1>{html.escape(title)}</h1>
            <div class="meta">Yayın tarihi: {today} · Issue #{number}</div>
            {content}
          </body>
          </html>"""

          pathlib.Path(filename).write_text(page, encoding="utf-8")

          index_path = pathlib.Path("index.html")
          link = f'<li><a href="{filename}">{html.escape(title)}</a> — {today}</li>'

          if index_path.exists():
              index = index_path.read_text(encoding="utf-8")
          else:
              index = "<!doctype html><html><body><h1>AI Editör Notları</h1><ul></ul></body></html>"

          if "</ul>" in index:
              index = index.replace("</ul>", link + "\n</ul>")
          else:
              index += "<ul>" + link + "</ul>"

          index_path.write_text(index, encoding="utf-8")

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          default_chat_id = os.environ["TELEGRAM_CHAT_ID"]
          haber_chat_id = os.environ.get("TELEGRAM_HABER_CHAT_ID", default_chat_id)

          lower_title = title.lower()
          chat_id = haber_chat_id if ("[haber]" in lower_title or "haber" in lower_title) else default_chat_id

          page_url = f"https://{os.environ['GITHUB_REPOSITORY_OWNER']}.github.io/editor-notlari/{filename}"
          message = f"Editör Notu:\n\n{title}\n\n{page_url}"

          data = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode("utf-8")
          api_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"

          req = urllib.request.Request(api_url, data=data, method="POST")
          with urllib.request.urlopen(req) as response:
              print(response.read().decode("utf-8"))

          print(filename)
          PY

      - name: Commit generated page
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Publish AI note as page" || echo "No changes"
          git push
